# LoRA fine-tuning config for Llama-3.2-3B-Instruct
# mlx-lm 0.31.x

model: mlx-community/Llama-3.2-3B-Instruct

# Dataset — dir must contain train.jsonl, valid.jsonl, test.jsonl
data: dataset/processed
train: true
mask_prompt: true

# Output
adapter_path: training/adapters

# LoRA hyperparameters
num_layers: 16
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 10.0

# Training hyperparameters
batch_size: 2            # lowered from 4 — 24GB unified memory OOM'd at batch_size=4
iters: 1200              # ~3 epochs over 800 samples (800/2 = 400 steps/epoch)
val_batches: 25          # full valid set
learning_rate: 1e-4
steps_per_eval: 200
save_every: 200
grad_checkpoint: true    # trade compute for memory — recompute activations in backward pass
max_seq_length: 1024     # p99 sequence length is ~750 tokens; caps rare long outliers

# Optimizer
optimizer: adam
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1e-4, 1200, 1e-5]
